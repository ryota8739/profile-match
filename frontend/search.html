<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ProfileMatch - 検索</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            margin: 0;
            background: #f5f6f8;
            color: #333;
        }


        header {
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 15px 30px;
        }


        header h1 {
            margin: 0;
            font-size: 24px;
        }


        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }


        .search-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }


        .search-box h2 {
            margin-top: 0;
        }


        .field {
            margin-bottom: 18px;
        }


        .field label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }


        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }


        input {
            width: 100px;
        }


        select {
            width: 200px;
        }


        button {
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
        }


        .search-button {
            background: #4f46e5;
            color: white;
            width: 100%;
            margin-top: 10px;
        }


        .search-button:hover {
            background: #4338ca;
        }


        #resultCount {
            margin-bottom: 15px;
            font-weight: bold;
        }


        .user-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }


        .user-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }


        .user-info {
            line-height: 1.8;
        }


        .profile-button {
            background: #333;
            color: white;
            margin-top: 10px;
        }


        .profile-button:hover {
            background: #111;
        }


        .message {
            padding: 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 15px;
        }


        .error {
            color: #dc2626;
        }


        .loading {
            color: #666;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .back-button {
            text-decoration: none;
            color: #4f46e5;
            font-weight: bold;
            font-size: 14px;
            padding: 8px 14px;
            border: 1px solid #4f46e5;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .back-button:hover {
            background: #4f46e5;
            color: white;
        }

    </style>

</head>


<body>


<header>

    <div class="header-content">
        <h1>ProfileMatch</h1>
        <a href="mypage.html" class="back-button">← マイページへ戻る</a>
    </div>

</header>


<main>


    <!-- ================================ -->
    <!-- 検索条件 -->
    <!-- ================================ -->

    <div class="search-box">

        <h2>ユーザー検索</h2>


        <div class="field">

            <label>
                年齢
            </label>

            <input
                type="number"
                id="minAge"
                placeholder="20"
            >

            ～

            <input
                type="number"
                id="maxAge"
                placeholder="30"
            >

        </div>


        <div class="field">

            <label>
                身長
            </label>

            <input
                type="number"
                id="minHeight"
                placeholder="160"
            >

            ～

            <input
                type="number"
                id="maxHeight"
                placeholder="180"
            >

            cm

        </div>


        <div class="field">

            <label>
                年収
            </label>

            <input
                type="number"
                id="minIncome"
                placeholder="300"
            >

            ～

            <input
                type="number"
                id="maxIncome"
                placeholder="700"
            >

            万円

        </div>


        <div class="field">

            <label>
                地域
            </label>

            <select id="region">

                <option value="">
                    指定なし
                </option>

                <option value="Tokyo">
                    Tokyo
                </option>

                <option value="Saitama">
                    Saitama
                </option>

                <option value="Kanagawa">
                    Kanagawa
                </option>

                <option value="Chiba">
                    Chiba
                </option>

                <option value="Osaka">
                    Osaka
                </option>

                <option value="Kyoto">
                    Kyoto
                </option>

                <option value="Aichi">
                    Aichi
                </option>

                <option value="Fukuoka">
                    Fukuoka
                </option>

            </select>

        </div>


        <button
            class="search-button"
            onclick="searchUsers()"
        >
            検索
        </button>

    </div>


    <!-- ================================ -->
    <!-- 検索結果 -->
    <!-- ================================ -->

    <div id="resultCount"></div>

    <div id="message"></div>

    <div id="results"></div>

    <script src="./js/common.js"></script>
    <script src="./js/search.js"></script>


</main>


</body>

</html>
