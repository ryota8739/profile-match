<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ProfileMatch - プロフィール</title>


    <style>

        body {
            font-family: sans-serif;
            background: #f5f6f8;
            margin: 0;
        }


        header {
            background: white;
            padding: 15px 30px;
            border-bottom: 1px solid #ddd;
        }


        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }


        .profile {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .profile h2 {
            margin-top: 0;
        }


        .info {
            line-height: 2;
        }


        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>

</head>


<body>


<header>

    <h1>ProfileMatch</h1>

</header>


<main>

    <div
        id="profile"
        class="profile"
    >
        読み込み中...
    </div>

</main>


<script>


const API_BASE_URL =
    "http://3.112.113.250:8000";


// ==================================================
// プロフィール取得
// ==================================================

async function loadProfile() {


    const params =
        new URLSearchParams(
            window.location.search
        );


    const userId =
        params.get("id");


    if (!userId) {

        document.getElementById("profile")
            .innerHTML = `
                <p>
                    ユーザーIDが指定されていません。
                </p>
            `;

        return;

    }


    try {


        const response =
            await fetch(
                `${API_BASE_URL}/api/users/${encodeURIComponent(userId)}`
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const user =
            await response.json();


        const hobbies =
            (user.hobbies || []).join("、");


        document.getElementById("profile")
            .innerHTML = `

                <h2>
                    ${escapeHtml(user.name)}
                </h2>


                <div class="info">

                    <div>
                        年齢：
                        ${user.age}歳
                    </div>


                    <div>
                        身長：
                        ${user.height}cm
                    </div>


                    <div>
                        性別：
                        ${escapeHtml(user.gender || "")}
                    </div>


                    <div>
                        職種：
                        ${escapeHtml(user.job || "")}
                    </div>


                    <div>
                        年収：
                        ${user.income}万円
                    </div>


                    <div>
                        地域：
                        ${escapeHtml(user.region || "")}
                    </div>


                    <div>
                        趣味：
                        ${escapeHtml(hobbies)}
                    </div>

                </div>


                <button
                    class="back-button"
                    onclick="history.back()"
                >
                    ← 検索結果に戻る
                </button>

            `;


    } catch (error) {


        console.error(
            "Profile error:",
            error
        );


        document.getElementById("profile")
            .innerHTML = `
                <p>
                    プロフィールの取得に失敗しました。
                </p>
            `;

    }

}


// ==================================================
// XSS対策
// ==================================================

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


loadProfile();


</script>


</body>

</html>
