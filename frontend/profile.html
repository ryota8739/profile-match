<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ProfileMatch - プロフィール</title>

    <style>

    body {
        font-family: sans-serif;
        background: #f5f6f8;
        margin: 0;
    }


    header {
        background: white;
        padding: 15px 30px;
        border-bottom: 1px solid #ddd;
    }


    main {
        max-width: 700px;
        margin: 30px auto;
        padding: 20px;
    }


    .profile {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow:
            0 2px 8px rgba(0,0,0,0.08);
    }


    .profile h2 {
        margin-top: 0;
    }


    .info {
        line-height: 2;
    }


    /* ==============================================
       ボタン
       ============================================== */

    .button-area {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }


    .button-area button {
        flex: 1;
        padding: 12px 20px;

        border: none;
        border-radius: 6px;

        cursor: pointer;

        font-size: 14px;
    }


    .back-button {
        background: #eee;
        color: #333;
    }


    .back-button:hover {
        background: #ddd;
    }


    .bookmark-button {
        background: #4a90e2;
        color: white;
    }


    .bookmark-button:hover {
        background: #357abd;
    }


    .bookmark-button:disabled {
        background: #aaa;
        cursor: default;
    }


    /* ==============================================
       プロフィール画像
       ============================================== */

    .profile-image-container {
        text-align: center;
        margin-bottom: 25px;
    }


    .profile-image {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 50%;
        border: 1px solid #ddd;
    }


    .no-image {
        width: 200px;
        height: 200px;
        margin: 0 auto 25px;
        border-radius: 50%;
        background: #eee;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #777;
    }


    /* ==============================================
       メッセージ
       ============================================== */

    #bookmarkMessage {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
    }


    /* ==============================================
       スマートフォン
       ============================================== */

    @media (max-width: 600px) {

        main {
            margin: 20px auto;
            padding: 15px;
        }


        .profile {
            padding: 20px;
        }


        .button-area {
            flex-direction: column;
        }

    }

</style>

</head>


<body>


<header>

    <h1>ProfileMatch</h1>

</header>


<main>

    <div
        id="profile"
        class="profile"
    >
        読み込み中...
    </div>

</main>


<script src="./js/common.js"></script>


<script>


// ==================================================
// プロフィール取得
// ==================================================

async function loadProfile() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const userId =
        params.get("id");


    // ==================================================
    // ユーザーID確認
    // ==================================================

    if (!userId) {

        document.getElementById("profile")
            .innerHTML = `
                <p>
                    ユーザーIDが指定されていません。
                </p>
            `;

        return;
    }


    // ==================================================
    // 自分自身のプロフィールの場合
    // ==================================================

    if (userId === currentUserId) {

        document.getElementById("profile")
            .innerHTML = `
                <p>
                    自分のプロフィールです。
                </p>

                <div class="button-area">

                    <button
                        class="back-button"
                        onclick="history.back()"
                    >
                        ← 戻る
                    </button>

                </div>
            `;

        return;
    }


    try {

        // ==================================================
        // プロフィール情報取得
        // ==================================================

        const response =
            await fetch(
                `${API_BASE_URL}/api/users/${encodeURIComponent(userId)}`
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const user =
            await response.json();


        // ==================================================
        // プロフィール画像取得
        // ==================================================

        let imageUrl = null;


        try {

            const imageResponse =
                await fetch(
                    `${API_BASE_URL}/api/profile/image-url/${encodeURIComponent(userId)}`
                );


            if (imageResponse.ok) {

                const imageData =
                    await imageResponse.json();


                imageUrl =
                    imageData.url;

            }

        } catch (error) {

            console.error(
                "Profile image error:",
                error
            );

        }


        // ==================================================
        // 趣味
        // ==================================================

        const hobbies =
            (user.hobbies || []).join("、");


        // ==================================================
        // プロフィール表示
        // ==================================================

        document.getElementById("profile")
            .innerHTML = `

                ${
                    imageUrl
                        ? `
                            <div class="profile-image-container">

                                <img
                                    src="${escapeHtml(imageUrl)}"
                                    alt="プロフィール画像"
                                    class="profile-image"
                                >

                            </div>
                          `
                        : `
                            <div class="no-image">
                                プロフィール画像なし
                            </div>
                          `
                }


                <h2>
                    ${escapeHtml(user.name)}
                </h2>


                <div class="info">

                    <div>
                        年齢：
                        ${user.age}歳
                    </div>


                    <div>
                        身長：
                        ${user.height}cm
                    </div>


                    <div>
                        性別：
                        ${escapeHtml(user.gender || "")}
                    </div>


                    <div>
                        職種：
                        ${escapeHtml(user.job || "")}
                    </div>


                    <div>
                        年収：
                        ${user.income}万円
                    </div>


                    <div>
                        地域：
                        ${escapeHtml(user.region || "")}
                    </div>


                    <div>
                        趣味：
                        ${escapeHtml(hobbies)}
                    </div>

                </div>


                <!-- ======================================
                     ボタン
                     ====================================== -->

                <div class="button-area">

                    <button
                        class="back-button"
                        onclick="history.back()"
                    >
                        ← 検索結果に戻る
                    </button>


                    <button
                        id="bookmarkButton"
                        class="bookmark-button"
                        onclick="bookmarkUser('${escapeHtml(user.user_id)}')"
                    >
                        ♡ ブックマーク
                    </button>

                </div>


                <div
                    id="bookmarkMessage"
                ></div>

            `;


    } catch (error) {

        console.error(
            "Profile error:",
            error
        );


        document.getElementById("profile")
            .innerHTML = `
                <p>
                    プロフィールの取得に失敗しました。
                </p>

                <div class="button-area">

                    <button
                        class="back-button"
                        onclick="history.back()"
                    >
                        ← 戻る
                    </button>

                </div>
            `;

    }

}


// ==================================================
// ブックマーク
// ==================================================

async function bookmarkUser(
    targetUserId
) {

    const button =
        document.getElementById(
            "bookmarkButton"
        );


    const message =
        document.getElementById(
            "bookmarkMessage"
        );


    if (!targetUserId) {

        alert(
            "ユーザーIDを取得できませんでした。"
        );

        return;
    }


    // ==================================================
    // 自分自身へのブックマーク防止
    // ==================================================

    if (
        targetUserId === currentUserId
    ) {

        alert(
            "自分自身はブックマークできません。"
        );

        return;
    }


    button.disabled = true;


    try {

        const params =
            new URLSearchParams();


        params.append(
            "user_id",
            currentUserId
        );


        params.append(
            "target_user_id",
            targetUserId
        );


        const response =
            await fetch(
                `${API_BASE_URL}/api/bookmarks?${params.toString()}`,
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        console.log(
            "Bookmark response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        // ==================================================
        // マッチ成立
        // ==================================================

        if (data.matched) {

            message.textContent =
                "🎉 マッチングしました！";


            button.textContent =
                "🎉 マッチング済み";


            alert(
                "🎉 マッチングしました！"
            );

        }


        // ==================================================
        // すでに登録済み
        // ==================================================

        else if (
            data.message ===
            "Already bookmarked"
        ) {

            message.textContent =
                "すでにブックマークしています。";


            button.textContent =
                "♥ ブックマーク済み";


            alert(
                "すでにブックマークしています。"
            );

        }


        // ==================================================
        // 通常のブックマーク
        // ==================================================

        else {

            message.textContent =
                "♡ ブックマークしました！";


            button.textContent =
                "♥ ブックマーク済み";


            alert(
                "♡ ブックマークしました！"
            );

        }


    } catch (error) {

        console.error(
            "Bookmark error:",
            error
        );


        message.textContent =
            "ブックマークに失敗しました。";


        alert(
            "ブックマークに失敗しました。"
        );


        button.disabled = false;

    }

}


// ==================================================
// XSS対策
// ==================================================

function escapeHtml(
    value
) {

    const div =
        document.createElement("div");


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


// ==================================================
// 実行
// ==================================================

loadProfile();


</script>


</body>

</html>
