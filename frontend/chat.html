<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>チャット - Profile Match</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                sans-serif;

            background: #f5f5f5;

            margin: 0;

            height: 100vh;

            display: flex;

            flex-direction: column;
        }


        .header {

            background: #4a90e2;

            color: white;

            padding: 15px 20px;

            display: flex;

            align-items: center;
        }


        .back-button {

            color: white;

            text-decoration: none;

            font-size: 20px;

            margin-right: 15px;
        }


        .header-name {

            font-size: 18px;

            font-weight: bold;
        }


        .chat-container {

            flex: 1;

            max-width: 700px;

            width: 100%;

            margin: 0 auto;

            display: flex;

            flex-direction: column;

            background: white;
        }


        .messages {

            flex: 1;

            overflow-y: auto;

            padding: 20px;
        }


        .message-row {
            width: 100%;

            display: flex;

            margin-bottom: 10px;
        }


        .message-row.mine {

            justify-content: flex-end;
        }


        .message-row.other {

            justify-content: flex-start;
        }


        .message-row > div {
            max-width: 70%;
            min-width: 0;

            display: flex;
            flex-direction: column;
        }

        .message {
            display: block;

            width: fit-content;
            max-width: 100%;

            padding: 10px 14px;

            border-radius: 15px;

            word-break: normal;
            overflow-wrap: break-word;

            white-space: pre-wrap;

            box-sizing: border-box;
        }

        .mine .message {

            background: #4a90e2;

            color: white;

            border-bottom-right-radius: 3px;
        }


        .other .message {

            background: #eeeeee;

            color: #333;

            border-bottom-left-radius: 3px;
        }


        .time {

            font-size: 11px;

            color: #999;

            margin: 4px 8px;
        }


        .input-area {

            display: flex;

            padding: 12px;

            border-top: 1px solid #ddd;

            background: white;
        }


        #messageInput {

            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 20px;

            outline: none;

            font-size: 15px;
        }


        #sendButton {

            margin-left: 10px;

            padding: 10px 20px;

            border: none;

            border-radius: 20px;

            background: #4a90e2;

            color: white;

            cursor: pointer;

            font-size: 15px;
        }


        #sendButton:disabled {

            background: #aaa;

            cursor: default;
        }


        .empty {

            text-align: center;

            color: #999;

            padding: 30px;
        }

    </style>

</head>


<body>


    <div class="header">

        <a
            href="messages.html"
            class="back-button"
        >
            ←
        </a>

        <div
            id="partnerName"
            class="header-name"
        >
            読み込み中...
        </div>

    </div>


    <div class="chat-container">


        <div
            id="messages"
            class="messages"
        >

            <div class="empty">
                メッセージを読み込み中...
            </div>

        </div>


        <div class="input-area">

            <textarea
                id="messageInput"
                placeholder="メッセージを入力..."
                maxlength="1000"
                rows="1"
            ></textarea>


            <button
                id="sendButton"
            >
                送信
            </button>

        </div>


    </div>


    <script src="./js/common.js"></script>
    <script src="./js/chat.js"></script>


</body>

</html>
